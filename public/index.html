<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - 30S & 1M</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #0e0e0e;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .history-box {
      background: #1b1b1b;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 0 10px rgba(0,255,200,0.1);
      margin-bottom: 18px;
    }
    .history-title {
      text-align: center;
      background: #292929;
      color: #00ffc8;
      font-size: 17px;
      font-weight: bold;
      padding: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 350px;
    }
    th {
      background: #222;
      color: #FFD700;
      padding: 10px;
      font-size: 14px;
    }
    td {
      padding: 10px;
      font-size: 14px;
      text-align: center;
      border-bottom: 1px solid #333;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }
    .dot.red { background: red; }
    .dot.green { background: lime; }
    .dot.violet { background: violet; }
    .num.red { color: #ff4c4c; font-weight: bold; }
    .num.green { color: #00ff88; font-weight: bold; }
    .num.violet { color: #bb66ff; font-weight: bold; }
    .loading { color: #aaa; padding: 15px; }
    .error { color: #ff4d4d; padding: 15px; }
  </style>
</head>
<body>

  <div class="history-box">
    <div class="history-title">HISTORY — 30S DATA</div>
    <table>
      <thead>
        <tr>
          <th>Period</th>
          <th>Number</th>
          <th>Big/Small</th>
          <th>Color</th>
        </tr>
      </thead>
      <tbody id="history30s">
        <tr><td colspan="4" class="loading">Loading 30S Data...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="history-box">
    <div class="history-title">HISTORY — 1M DATA</div>
    <table>
      <thead>
        <tr>
          <th>Period</th>
          <th>Number</th>
          <th>Big/Small</th>
          <th>Color</th>
        </tr>
      </thead>
      <tbody id="history1m">
        <tr><td colspan="4" class="loading">Loading 1M Data...</td></tr>
      </tbody>
    </table>
  </div>

<script>
const API_30S = 'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json';
const API_1M = 'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json';

function createHistoryRow(item) {
  const num = Number.parseInt(item.number, 10);
  if (!Number.isInteger(num) || num < 0 || num > 9) return null;

  const period = String(item.issueNumber ?? "");
  const size = num >= 5 ? "Big" : "Small";
  let color = 'green';
  if ([2, 4, 6, 8].includes(num)) color = "red";
  else if (num === 0 || num === 5) color = num === 0 ? "red,violet" : "green,violet";

  const row = document.createElement("tr");

  const periodCell = document.createElement("td");
  periodCell.textContent = period;

  const numberCell = document.createElement("td");
  numberCell.className = "num " + (color.includes('red') ? 'red' : (color.includes('violet') ? 'violet' : 'green'));
  numberCell.textContent = num;

  const sizeCell = document.createElement("td");
  sizeCell.textContent = size;

  const colorCell = document.createElement("td");
  const dot = document.createElement("span");
  dot.className = "dot " + (color.includes(',') ? color.split(',')[0] : color); 
  colorCell.appendChild(dot);
  colorCell.append(color);

  row.appendChild(periodCell);
  row.appendChild(numberCell);
  row.appendChild(sizeCell);
  row.appendChild(colorCell);

  return row;
}

// ব্রাউজার থেকে সার্ভারে ডেটা পাঠিয়ে দেওয়া
async function syncToServer(type, rawList) {
  try {
    const formattedList = rawList.map(item => {
      const num = Number.parseInt(item.number, 10);
      const size = num >= 5 ? "Big" : "Small";
      let color = 'green';
      if ([2, 4, 6, 8].includes(num)) color = "red";
      else if (num === 0 || num === 5) color = num === 0 ? "red,violet" : "green,violet";

      return {
        Period: String(item.issueNumber ?? ""),
        Number: num,
        Size: size,
        Colour: color,
        Time: new Date().toLocaleTimeString()
      };
    });

    await fetch('/api/sync-history', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, data: formattedList })
    });
  } catch (e) {
    console.error("Sync failed", e);
  }
}

async function loadHistory(apiUrl, type, tbodyID, label) {
  const tbody = document.getElementById(tbodyID);
  try {
    const response = await fetch(apiUrl + "?ts=" + Date.now(), { cache: "no-store" });
    if (!response.ok) throw new Error("Network error");
    
    const result = await response.json();
    if (!result.data || !Array.isArray(result.data.list)) {
      throw new Error("Invalid structure");
    }

    const rawList = result.data.list.slice(0, 10);
    
    // সার্ভারে ডেটা সিংক্রোনাইজ করুন
    syncToServer(type, rawList);

    const fragment = document.createDocumentFragment();
    rawList.forEach(item => {
      const row = createHistoryRow(item);
      if (row) fragment.appendChild(row);
    });

    tbody.replaceChildren(fragment);

  } catch (error) {
    const row = document.createElement("tr");
    const cell = document.createElement("td");
    cell.colSpan = 4;
    cell.className = "error";
    cell.textContent = "Failed to load " + label;
    row.appendChild(cell);
    tbody.replaceChildren(row);
  }
}

function runLoads() {
  loadHistory(API_30S, '30s', 'history30s', '30S');
  loadHistory(API_1M, '1m', 'history1m', '1M');
}

runLoads();
setInterval(runLoads, 5000);
</script>

</body>
</html>
